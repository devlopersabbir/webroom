name: CI

on:
  push:
    branches:
      - main
      - dev
      - next
      - "beta/**"
      - "alpha/**"
      - "bug/**"
  pull_request:
    branches:
      - main
      - dev
      - next

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test-and-lint:
    name: Test & Lint
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Setup Node.js (for web-ext & tooling)
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Run Test Suite
        run: bun test

      - name: Build Chrome Extension
        run: bun run build:chrome

      - name: Build & Lint Firefox Add-on (Strict Validation)
        run: bun run lint:firefox
