name: Deploy to Firefox Add-ons (AMO)

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      channel:
        description: "AMO Channel (listed for public store review, unlisted for signing)"
        required: true
        default: "listed"
        type: choice
        options:
          - listed
          - unlisted

jobs:
  deploy-firefox:
    name: Build & Submit to Firefox AMO
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Run Tests
        run: bun test

      - name: Build Firefox Extension
        run: bun run build:firefox

      - name: Package extension for AMO
        id: web-ext-build
        uses: kewisch/action-web-ext@v2
        with:
          cmd: build
          source: dist

      - name: Archive source code for Mozilla review
        run: git archive --format=zip --output=sources.zip HEAD

      - name: web-ext sign AMO
        id: web-ext-sign
        uses: kewisch/action-web-ext@v2
        with:
          cmd: sign
          source: ${{ steps.web-ext-build.outputs.target }}
          sourceCode: sources.zip
          channel: ${{ github.event.inputs.channel || 'listed' }}
          approvalNotes: "WebRoom is built with TypeScript and Vite. Run 'bun install && bun run build:firefox' to generate the dist bundle."
          releaseNotes: ${{ github.event.release.body }}
          apiKey: ${{ secrets.AMO_JWT_ISSUER }}
          apiSecret: ${{ secrets.AMO_JWT_SECRET }}
          timeout: 900000
