name: "🐛 Bug Report"
description: "Report a reproducible bug or unexpected behavior in WebRoom."
title: "[Bug]: "
labels: ["bug", "triage"]
body:
  - type: markdown
    attributes:
      value: |
        Thank you for reporting a bug in WebRoom! Please provide as much detail as possible to help us reproduce and resolve the issue quickly.

  - type: dropdown
    id: browser
    attributes:
      label: Browser
      description: Which browser are you using?
      options:
        - Mozilla Firefox
        - Google Chrome
        - Brave Browser
        - Microsoft Edge
        - Arc Browser
        - Opera / Opera GX
        - Other (specify in description)
    validations:
      required: true

  - type: input
    id: browser-version
    attributes:
      label: Browser Version
      description: e.g. Firefox 142.0, Chrome 128.0.6613.120
      placeholder: "e.g. 142.0"
    validations:
      required: true

  - type: input
    id: extension-version
    attributes:
      label: WebRoom Extension Version
      description: What version of WebRoom are you running? (e.g. v2.4.0)
      placeholder: "e.g. 2.4.0"
    validations:
      required: true

  - type: input
    id: page-url
    attributes:
      label: Affected Webpage / URL
      description: The URL where the issue occurred (if applicable and public).
      placeholder: "https://example.com"
    validations:
      required: false

  - type: textarea
    id: description
    attributes:
      label: Describe the Bug
      description: A clear and concise description of what the bug is.
      placeholder: "When opening a room on GitHub, the extension fails to connect..."
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: Steps to Reproduce
      description: How can we reproduce this issue?
      placeholder: |
        1. Open URL '...'
        2. Click on '...'
        3. Scroll down to '...'
        4. See error in console
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected Behavior
      description: What did you expect to happen?
      placeholder: "Peers should discover each other and join the decentralized room."
    validations:
      required: true

  - type: textarea
    id: actual
    attributes:
      label: Actual Behavior
      description: What actually happened?
    validations:
      required: true

  - type: textarea
    id: logs
    attributes:
      label: Console Logs / Error Stack Trace
      description: Paste any error messages from the browser developer console (F12) or extension background inspect view.
      render: shell
      placeholder: "Error: ..."
    validations:
      required: false

  - type: textarea
    id: additional-context
    attributes:
      label: Additional Context & Screenshots
      description: Add any other context, screenshots, or screen recordings about the problem here (drag & drop images).
    validations:
      required: false

  - type: checkboxes
    id: confirmation
    attributes:
      label: Confirmation
      options:
        - label: I have searched existing issues to ensure this is not a duplicate.
          required: true
        - label: I am running the latest version of WebRoom.
          required: false
